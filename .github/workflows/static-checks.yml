name: UMBRA source integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: umbra-static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python scripts syntax
        run: python -m compileall -q scripts
      - name: Check C# references, assets, translations and metadata
        run: python scripts/validate_source.py
      - name: Validate NPC frame-sheet geometry
        run: python scripts/validate_visual_animation.py
      - name: Validate combat hit effects and ownership guards
        run: python scripts/validate_combat_visuals.py
      - name: Validate client-only biome atmosphere
        run: python scripts/validate_biome_atmosphere.py
      - name: Validate invasion multiplayer spawn selection
        run: python scripts/validate_invasion_spawn.py
      - name: Validate safe world-event spawns
        run: python scripts/validate_safe_spawns.py
      - name: Validate world save and load of the invasion
        run: python scripts/validate_invasion_persistence.py
      - name: Check repository metadata
        run: python scripts/validate_repository.py
