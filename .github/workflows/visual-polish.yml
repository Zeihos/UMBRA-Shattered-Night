name: UMBRA visual sprite polish
on:
  push:
    branches: [main]
    paths: ['scripts/visual_polish.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: umbra-visual-polish-main
  cancel-in-progress: false
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pixel-art tooling
        run: python -m pip install 'Pillow==11.3.0'
      - name: Polish original sprites preserving sprite dimensions
        run: python scripts/visual_polish.py
      - name: Validate assets and source references
        run: python scripts/validate_source.py
      - name: Commit generated sprites to private repository
        shell: bash
        run: |
          git config user.name "UMBRA Visual CI"
          git config user.email "actions@users.noreply.github.com"
          git add Content icon.png build.txt scripts/.visual-063-applied
          if ! git diff --cached --quiet; then
            git commit -m "Polish all 145 existing PNGs (v0.63.0)"
            git push origin HEAD:main
          fi
